[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "huz-subtitle"
version = "0.1.0"
description = "Generate subtitle files from video/audio with MLX ASR models."
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "fastapi>=0.115",
  "huggingface-hub>=1.0",
  "mlx-audio[stt] @ git+https://github.com/Blaizzy/mlx-audio.git@c161e7a9f69c614da09b0fa9bfdf300902b7154d",
  "python-multipart>=0.0.20",
  "safetensors>=0.4",
  "soundfile>=0.12.0",
  "uvicorn>=0.34",
]

[project.scripts]
huz-srt = "huz_subtitle.cli:main"
huz-web = "huz_subtitle.web:main"
msub-srt = "huz_subtitle.cli:main"
msub-web = "huz_subtitle.web:main"

[project.optional-dependencies]
native = [
    "coremltools>=9.0",
    "kaldi-native-fbank>=1.15",
    "kaldiio>=2.18.0",
    "soundfile>=0.12.0",
]
legacy-vad = [
    "fireredvad>=0.0.2",
]
firered-vad-coreml = [
    "coremltools>=9.0",
    "kaldi-native-fbank>=1.15",
    "kaldiio>=2.18.0",
    "soundfile>=0.12.0",
]
diarization = [
    "pyannote-audio>=4.0.4",
]
punc = [
    # FireRedPunc currently pins an older transformers version that conflicts
    # with mlx-audio. Keep --punctuate as a runtime-compatible entry point, but
    # install FireRedPunc manually in a separate environment if needed.
]
speaker = [
    # Legacy torch-based speaker recognition path. The default app route is
    # acoustic/CoreML speaker labeling.
    "funasr>=1.2.6",
    "modelscope>=1.20",
    "torch>=2.0",
    "torchaudio>=2.0",
    "pytorch-wpe",
    "soundfile",
]
emotion = [
    # Legacy torch-based emotion2vec path. The default app route is
    # mlx-community/emotion2vec-plus-large-mlx.
    "funasr>=1.2.6",
    "modelscope>=1.20",
    "torch>=2.0",
    "torchaudio>=2.0",
    "pytorch-wpe",
    "soundfile",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/huz_subtitle"]
