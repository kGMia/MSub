# CI for the MSub macOS app (this repository covers apps/MSub only; the
# Python development backend lives outside the repo; Backend is the tracked
# release snapshot and has a lightweight CPU regression job below).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    # Match the Xcode/SwiftPM macOS 27 deployment target and AVFoundation APIs.
    # Official arm64 image: actions/runner-images/images/macos/xcode-27-arm64-Readme.md
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Resolve pinned dependencies and apply Metal compatibility
        run: |
          swift package resolve
          python3 Scripts/patch-mlx-metal.py .build/checkouts
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  backend-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify backend source manifest
        run: python Scripts/backend-snapshot.py
      - name: Install CPU test dependencies
        run: python -m pip install pytest numpy
      - name: Check syntax and backend contracts without model downloads
        working-directory: Backend
        run: |
          python -m compileall -q src
          python -m pytest tests/test_qwen_repetition.py tests/test_args_and_engines.py tests/test_timestamps_and_text.py -q
