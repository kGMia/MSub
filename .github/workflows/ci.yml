# CI for the MSub macOS app (this repository covers apps/MSub only; the
# Python backend lives outside the repo and has its own pytest suite that
# runs locally via `uv run pytest tests/`).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    # The app targets macOS 26, which needs the Xcode 26 toolchain.
    # If this runner label is not yet available for your plan, switch to the
    # newest macos-* label that ships Xcode 26.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
