# CI for the MSub macOS app (this repository covers apps/MSub only; the
# Python backend lives outside the repo and has its own pytest suite that
# runs locally via `uv run pytest tests/`).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    # Match the Xcode/SwiftPM macOS 27 deployment target and AVFoundation APIs.
    # Official arm64 image: actions/runner-images/images/macos/xcode-27-arm64-Readme.md
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Resolve pinned dependencies and apply Metal compatibility
        run: |
          swift package resolve
          python3 Scripts/patch-mlx-metal.py .build/checkouts
      - name: Build
        run: swift build
      - name: Test
        run: swift test
